name: Release

# Push a tag like v1.2.3 to publish a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and download URL from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "$REPO_URL" \
             --arg manifest "$REPO_URL/releases/latest/download/module.json" \
             --arg download "$REPO_URL/releases/download/$TAG/module.zip" \
             '.version = $v | .url = $url | .manifest = $manifest | .download = $download' \
             module.json > module.tmp.json
          mv module.tmp.json module.json
          cat module.json

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" module.json module.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
